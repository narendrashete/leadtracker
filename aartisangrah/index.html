<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>आरती संग्रह</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF1DC;
    --paper-deep:#F4E6C4;
    --card:#FFFDF6;
    --maroon:#7A1B2E;
    --maroon-dark:#57101F;
    --gold:#B9852B;
    --gold-light:#E8C874;
    --gold-pale:#F3E1B0;
    --ink:#3A2410;
    --ink-soft:#6B5236;
    --shadow: 0 10px 30px rgba(58,24,16,0.18);
    --shadow-sm: 0 4px 14px rgba(58,24,16,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #efe0bc 0%, #d9c391 100%);
    font-family:'Noto Sans Devanagari', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .app-shell{
    width:100%;
    max-width:480px;
    height:100dvh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
  }

  /* ---------- Masthead ---------- */
  .masthead{
    background: linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color: var(--gold-light);
    padding:14px 16px 12px;
    text-align:center;
    position:relative;
    flex-shrink:0;
    border-bottom: 3px solid var(--gold);
  }
  .masthead h1{
    font-family:'Tiro Devanagari Marathi', serif;
    margin:0;
    font-size:22px;
    letter-spacing:0.5px;
    font-weight:400;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .masthead .diya{
    width:20px;height:20px;flex-shrink:0;
  }
  /* Family seal, absolutely positioned so it never shifts the centred title.
     The PNG is cut to the scalloped edge with a transparent surround, so it
     reads as stamped straight onto the masthead gradient. */
  /* Ganpati medallion, mirroring the seal across the masthead. Absolutely
     positioned for the same reason: the title stays centred on the bar, not on
     whatever space is left over. */
  .masthead .ganpati{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    pointer-events:none;
  }
  .masthead .seal{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    cursor:pointer;
    transition:transform 0.15s ease;
  }
  .masthead .seal:active{transform:translateY(-50%) scale(0.92);}

  /* Tap the seal to read it: the same image, enlarged and centred. A tap
     anywhere on the overlay closes it — the × is an affordance, not the only
     way out — which is why the image itself does not stop the click. */
  .seal-overlay{
    position:absolute;
    inset:0;
    background:rgba(30,15,8,0.72);
    z-index:60;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .seal-overlay.show{display:flex;}
  .seal-overlay img{
    width:min(78vw, 330px);
    height:auto;
    filter: drop-shadow(0 12px 34px rgba(0,0,0,0.5));
    animation: sealPop 0.24s ease;
  }
  @keyframes sealPop{
    from{transform:scale(0.82); opacity:0;}
    to{transform:scale(1); opacity:1;}
  }
  .seal-overlay .seal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--paper-deep);
    color:var(--maroon);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
  }
  .masthead .sub{
    font-size:11px;
    color: var(--gold-pale);
    opacity:0.85;
    margin-top:2px;
    letter-spacing:1.5px;
  }

  /* ---------- Controls row ---------- */
  .controls{
    display:flex;
    gap:8px;
    padding:10px 12px;
    background:var(--paper-deep);
    border-bottom:1px solid #e2cfa0;
    flex-shrink:0;
    position:relative;
    z-index:30;
  }
  .idx-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--maroon);
    color:var(--gold-light);
    border:none;
    border-radius:10px;
    padding:0 12px;
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:13px;
    font-weight:600;
    height:40px;
    flex-shrink:0;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
  }
  .idx-btn svg{width:18px;height:18px;}
  .search-wrap{
    position:relative;
    flex:1;
    min-width:0;
  }
  .search-wrap input{
    width:100%;
    height:40px;
    border-radius:10px;
    border:1.5px solid #d9c08a;
    background:var(--card);
    padding:0 36px 0 12px;
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{
    border-color:var(--maroon);
  }
  .search-wrap .sicon{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:16px;height:16px;
    color:var(--ink-soft);
    pointer-events:none;
  }
  .search-dropdown{
    position:absolute;
    top:46px;
    left:0;
    right:0;
    background:var(--card);
    border:1px solid #e2cfa0;
    border-radius:10px;
    box-shadow: var(--shadow);
    max-height:260px;
    overflow-y:auto;
    z-index:40;
    display:none;
  }
  .search-dropdown.show{display:block;}
  .search-dropdown .item{
    padding:10px 14px;
    font-size:13.5px;
    font-family:'Tiro Devanagari Marathi', serif;
    color:var(--ink);
    border-bottom:1px solid #f0e6cc;
    cursor:pointer;
  }
  .search-dropdown .item:last-child{border-bottom:none;}
  .search-dropdown .item:active, .search-dropdown .item.hi{background:var(--gold-pale);}
  .search-dropdown .empty{
    padding:14px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }

  /* ---------- Page viewport ---------- */
  .page-viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    padding:16px 14px 84px;
  }
  .page-card{
    height:100%;
    background:var(--card);
    border-radius:14px;
    box-shadow: var(--shadow);
    border:1px solid #ecd9ab;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .page-card::before, .page-card::after{
    content:"";
    position:absolute;
    width:34px;height:34px;
    border-color:var(--gold);
    opacity:0.55;
    pointer-events:none;
  }
  .page-card::before{
    top:8px; right:8px;
    border-top:2px solid var(--gold);
    border-right:2px solid var(--gold);
    border-radius:0 8px 0 0;
  }
  .page-card::after{
    bottom:8px; left:8px;
    border-bottom:2px solid var(--gold);
    border-left:2px solid var(--gold);
    border-radius:0 0 0 8px;
  }
  .page-title-wrap{
    padding:22px 20px 12px;
    text-align:center;
    flex-shrink:0;
  }
  .page-title{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:22px;
    color:var(--maroon);
    margin:0;
    line-height:1.35;
  }
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:10px auto 0;
    width:70%;
  }
  .divider .line{height:1px;flex:1;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .divider .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}

  /* ---------- mini player ---------- */
  .player{
    display:none;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:13px;
    min-height:38px;
  }
  .player.on{display:flex;}
  .pbtn{
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    flex-shrink:0;
    cursor:pointer;
    background:linear-gradient(160deg, var(--gold-light), var(--gold));
    color:var(--maroon-dark);
    box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .pbtn[hidden]{display:none;}
  .pbtn:disabled{cursor:default;}
  .pbtn.ghost{
    background:var(--paper-deep);
    color:var(--maroon);
    border:1.5px solid #d9c08a;
    box-shadow:none;
  }
  .pbtn svg{width:16px;height:16px;}
  .pbtn .ico-wait{display:none;}
  .pbtn.loading .ico-play{display:none;}
  .pbtn.loading .ico-wait{display:block;animation:pspin 0.9s linear infinite;}
  @keyframes pspin{to{transform:rotate(360deg);}}

  .player.on{flex-direction:column;gap:9px;}
  .prow{display:flex;align-items:center;justify-content:center;gap:9px;min-height:38px;}
  .seekrow{display:flex;align-items:center;gap:9px;width:100%;}

  .ptime{
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
    min-width:30px;
  }
  .ptime.dur{text-align:right;}
  .pmsg{
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:11.5px;
    color:#A8322B;
    text-align:center;
  }
  .pmsg[hidden]{display:none;}

  /* A native range input: it comes with drag, touch, and arrow keys already
     working, which a div-and-pointer-maths slider would have to reinvent. */
  .seek{
    -webkit-appearance:none;appearance:none;
    flex:1;min-width:0;
    height:20px;margin:0;padding:0;
    background:transparent;
    cursor:pointer;
  }
  .seek:disabled{cursor:default;opacity:0.5;}
  .seek::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,
      var(--gold) 0, var(--gold) var(--p,0%), #E3D3AE var(--p,0%), #E3D3AE 100%);
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--maroon);
    border:2px solid var(--gold-light);
    margin-top:-5px;
    box-shadow:0 1px 4px rgba(58,24,16,0.35);
  }
  .seek::-moz-range-track{height:4px;border-radius:2px;background:#E3D3AE;}
  .seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--gold);}
  .seek::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:2px solid var(--gold-light);
    background:var(--maroon);
  }
  .seek:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  /* notes drifting up while it plays — the cue that sound is actually running */
  .notes{position:relative;width:22px;height:34px;flex-shrink:0;}
  .notes[hidden]{display:none;}
  .notes span{
    position:absolute;bottom:2px;left:50%;
    font-size:13px;color:var(--gold);
    opacity:0;
    animation:noteUp 2.4s linear infinite;
  }
  .notes span:nth-child(2){animation-delay:0.8s;font-size:11px;}
  .notes span:nth-child(3){animation-delay:1.6s;font-size:15px;}
  @keyframes noteUp{
    0%{transform:translate(-50%,6px) rotate(-10deg);opacity:0;}
    20%{opacity:0.95;}
    70%{opacity:0.65;}
    100%{transform:translate(calc(-50% + 9px),-26px) rotate(14deg);opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .notes span{animation:none;opacity:0.8;}
    .notes span:nth-child(2),.notes span:nth-child(3){opacity:0.5;}
    .pbtn.loading .ico-wait{animation:none;}
  }

  .page-content{
    flex:1;
    overflow-y:auto;
    padding:6px 22px 20px;
    -webkit-overflow-scrolling:touch;
  }
  .page-content p{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:17px;
    line-height:1.9;
    color:var(--ink);
    margin:0 0 18px;
    white-space:pre-line;
    text-align:center;
  }
  .page-content p:last-child{margin-bottom:4px;}
  .page-content .shlok-head{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:16px;
    font-weight:400;
    color:var(--maroon);
    text-align:center;
    margin:0 0 16px;
    padding-top:22px;
    border-top:1px solid rgba(185,133,43,0.4);
  }
  .page-content .shlok-head:first-child{padding-top:2px; border-top:none;}
  .page-content .section-back{
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:12.5px;
    color:var(--maroon);
    text-align:center;
    margin:0 0 14px;
    cursor:pointer;
    text-decoration:underline;
  }

  /* transition animations */
  .page-card.anim-next{animation: slideInNext 0.32s ease;}
  .page-card.anim-prev{animation: slideInPrev 0.32s ease;}
  @keyframes slideInNext{
    from{transform:translateX(26px) scale(0.98); opacity:0;}
    to{transform:translateX(0) scale(1); opacity:1;}
  }
  @keyframes slideInPrev{
    from{transform:translateX(-26px) scale(0.98); opacity:0;}
    to{transform:translateX(0) scale(1); opacity:1;}
  }

  /* ---------- Nav arrows & page indicator ---------- */
  .nav-btn{
    position:absolute;
    bottom:20px;
    width:52px;height:52px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    border:none;
    box-shadow: var(--shadow-sm);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:active{transform:scale(0.92);}
  .nav-btn svg{width:22px;height:22px;color:var(--maroon-dark);}
  .nav-prev{left:26px;}
  .nav-next{right:26px;}
  .nav-btn.hidden{opacity:0; pointer-events:none; transform:scale(0.6);}

  .page-indicator{
    position:absolute;
    bottom:32px;
    left:50%;
    transform:translateX(-50%);
    background:var(--maroon);
    color:var(--gold-pale);
    font-size:11.5px;
    font-family:'Noto Sans Devanagari',sans-serif;
    padding:5px 12px;
    border-radius:999px;
    z-index:19;
    letter-spacing:0.5px;
    box-shadow: var(--shadow-sm);
  }

  /* ---------- Index Modal ---------- */
  .modal-overlay{
    position:absolute;
    inset:0;
    background:rgba(30,15,8,0.45);
    z-index:50;
    display:none;
    align-items:flex-end;
  }
  .modal-overlay.show{display:flex;}
  .modal-sheet{
    width:100%;
    max-height:82%;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    display:flex;
    flex-direction:column;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
    animation: sheetUp 0.28s ease;
  }
  @keyframes sheetUp{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
  }
  .modal-handle{
    width:40px;height:4px;border-radius:2px;
    background:#d9c08a;
    margin:10px auto 4px;
    flex-shrink:0;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 10px;
    flex-shrink:0;
  }
  .modal-header h2{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:19px;
    color:var(--maroon);
    margin:0;
    font-weight:400;
  }
  .modal-close{
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:var(--paper-deep);
    color:var(--maroon);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-search{
    padding:0 18px 12px;
    flex-shrink:0;
  }
  .modal-search input{
    width:100%;
    height:40px;
    border-radius:10px;
    border:1.5px solid #d9c08a;
    background:var(--card);
    padding:0 12px;
    font-family:'Noto Sans Devanagari',sans-serif;
    font-size:13.5px;
    outline:none;
  }
  .modal-search input:focus{border-color:var(--maroon);}
  .modal-list{
    overflow-y:auto;
    padding:0 10px 24px;
    -webkit-overflow-scrolling:touch;
  }
  .modal-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-bottom:1px solid #ecdcae;
    cursor:pointer;
  }
  .modal-item:active{background:var(--gold-pale);}
  .modal-item .num{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--maroon);
    color:var(--gold-pale);
    font-size:11px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .modal-item .txt{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:16px;
    color:var(--ink);
  }
  .modal-item.current{background:var(--gold-pale);}
  .modal-item.current .num{background:var(--gold);color:var(--maroon-dark);}
  .modal-item.modal-folder .num,
  .modal-item.modal-back .num{
    background:var(--gold-pale);
    color:var(--maroon-dark);
    font-size:14px;
  }
  .no-results{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:24px;
  }
</style>
</head>

let current = 0;

const pageTitle = document.getElementById('pageTitle');
const pageContent = document.getElementById('pageContent');
const pageCard = document.getElementById('pageCard');
const pageIndicator = document.getElementById('pageIndicator');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderPage(idx, direction){
  const a = aartis[idx];
  // Turning the page always silences the previous one: the controls live on the
  // page, so audio left running elsewhere would have nothing to stop it.
  stopAudio();
  trackSrc = a.audio || null;
  player.classList.toggle('on', !!trackSrc);
  pmsg.hidden = true;
  if(trackSrc) ensureAudio(trackSrc);   // pulls the header, so the bar has a scale
  pageTitle.textContent = a.title;
  // A body line prefixed with "## " is a sub-heading, not a verse — used by pages
  // that collect several separately-named prayers (see उत्सवी प्रार्थना).
  const backLink = a.section
    ? `<div class="section-back" onclick="openModalSection('${a.section}')">← ${a.sectionLabel} कडे परत</div>`
    : '';
  pageContent.innerHTML = backLink + a.body.map(p => p.startsWith('## ')
    ? `<h3 class="shlok-head">${p.slice(3)}</h3>`
    : `<p>${p}</p>`).join('');
  pageContent.scrollTop = 0;
  pageIndicator.textContent = (idx+1) + ' / ' + aartis.length;
  prevBtn.classList.toggle('hidden', idx === 0);
  nextBtn.classList.toggle('hidden', idx === aartis.length - 1);

  pageCard.classList.remove('anim-next','anim-prev');
  void pageCard.offsetWidth;
  if(direction === 'next') pageCard.classList.add('anim-next');
  if(direction === 'prev') pageCard.classList.add('anim-prev');

  current = idx;
}

function goTo(idx){
  if(idx < 0 || idx >= aartis.length) return;
  const direction = idx > current ? 'next' : 'prev';
  renderPage(idx, direction);
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(current + 1);
  if(e.key === 'ArrowLeft') goTo(current - 1);
});

// swipe support
let touchStartX = null;
const viewport = document.querySelector('.page-viewport');
viewport.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
viewport.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 55){
    if(dx < 0) goTo(current + 1);
    else goTo(current - 1);
  }
  touchStartX = null;
}, {passive:true});

/* ---------------- Search (top bar) ---------------- */
const searchInput = document.getElementById('searchInput');
const searchDropdown = document.getElementById('searchDropdown');

function matchScore(a, q){
  const hay = (a.title + ' ' + a.tag + ' ' + a.keywords).toLowerCase();
  return hay.includes(q) ? 1 : 0;
}

function renderDropdown(q){
  if(!q){
    searchDropdown.classList.remove('show');
    searchDropdown.innerHTML = '';
    return;
  }
  const ql = q.toLowerCase().trim();
  const results = aartis
    .map((a, i) => ({a, i}))
    .filter(o => matchScore(o.a, ql))
    .slice(0, 8);

  if(results.length === 0){
    searchDropdown.innerHTML = '<div class="empty">काही सापडले नाही</div>';
  } else {
    searchDropdown.innerHTML = results.map(o =>
      `<div class="item" data-idx="${o.i}">${o.a.title}<br><small style="color:#8a6f45;font-family:'Noto Sans Devanagari',sans-serif;">${o.a.tag}</small></div>`
    ).join('');
  }
  searchDropdown.classList.add('show');
}

searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
searchInput.addEventListener('focus', () => { if(searchInput.value) renderDropdown(searchInput.value); });

searchDropdown.addEventListener('click', (e) => {
  const item = e.target.closest('.item[data-idx]');
  if(!item) return;
  const idx = parseInt(item.dataset.idx, 10);
  goTo(idx);
  searchInput.value = '';
  searchDropdown.classList.remove('show');
  searchInput.blur();
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')){
    searchDropdown.classList.remove('show');
  }
});

/* ---------------- Index Modal ---------------- */
const idxBtn = document.getElementById('idxBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalList = document.getElementById('modalList');
const modalSearchInput = document.getElementById('modalSearchInput');

function modalItemHtml(a, idx, num){
  return `
    <div class="modal-item ${idx === current ? 'current' : ''}" data-idx="${idx}">
      <div class="num">${num}</div>
      <div class="txt">${a.title}<br><small style="color:#8a6f45;font-family:'Noto Sans Devanagari',sans-serif;font-size:11.5px;">${a.tag}</small></div>
    </div>
  `;
}

// null = top-level list. A section key = drilled into that section's own
// numbered sublist, entered by tapping its folder row.
let modalSection = null;

function renderModalList(q){
  const ql = (q||'').toLowerCase().trim();

  // A search in progress always shows a flat, matching list — drilling into
  // a section is for browsing, not for a targeted lookup.
  if(ql){
    modalSection = null;
    const items = aartis.map((a, i) => ({a, i})).filter(o => matchScore(o.a, ql));
    modalList.innerHTML = items.length === 0
      ? '<div class="no-results">काही सापडले नाही</div>'
      : items.map(o => modalItemHtml(o.a, o.i, o.i + 1)).join('');
    return;
  }

  if(modalSection){
    const items = aartis.map((a, i) => ({a, i})).filter(o => o.a.section === modalSection);
    modalList.innerHTML =
      `<div class="modal-item modal-back" data-back="1">
        <div class="num">←</div>
        <div class="txt">मुख्य यादीकडे परत</div>
      </div>` +
      items.map((o, n) => modalItemHtml(o.a, o.i, n + 1)).join('');
    return;
  }

  // Top level: each section collapses to one folder row, shown where its
  // first member would otherwise have appeared.
  const seenSections = new Set();
  const rows = [];
  aartis.forEach((a, i) => {
    if(a.section){
      if(seenSections.has(a.section)) return;
      seenSections.add(a.section);
      const count = aartis.filter(x => x.section === a.section).length;
      rows.push(
        `<div class="modal-item modal-folder" data-section="${a.section}">
          <div class="num">📁</div>
          <div class="txt">${a.sectionLabel}<br><small style="color:#8a6f45;font-family:'Noto Sans Devanagari',sans-serif;font-size:11.5px;">${count} आरत्या</small></div>
        </div>`
      );
      return;
    }
    rows.push(modalItemHtml(a, i, i + 1));
  });
  modalList.innerHTML = rows.join('');
}

function openModal(){
  modalSearchInput.value = '';
  modalSection = null;
  renderModalList('');
  modalOverlay.classList.add('show');
}
function openModalSection(section){
  modalSearchInput.value = '';
  modalSection = section;
  renderModalList('');
  modalOverlay.classList.add('show');
}
function closeModal(){
  modalOverlay.classList.remove('show');
}

idxBtn.addEventListener('click', openModal);
modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
modalSearchInput.addEventListener('input', () => renderModalList(modalSearchInput.value));

modalList.addEventListener('click', (e) => {
  if(e.target.closest('.modal-item.modal-back')){
    modalSection = null;
    renderModalList('');
    return;
  }
  const folder = e.target.closest('.modal-item.modal-folder[data-section]');
  if(folder){
    modalSection = folder.dataset.section;
    renderModalList('');
    return;
  }
  const item = e.target.closest('.modal-item[data-idx]');
  if(!item) return;
  const idx = parseInt(item.dataset.idx, 10);
  goTo(idx);
  closeModal();
});

/* seal lightbox */
const sealImg     = document.querySelector('.masthead .seal');
const sealOverlay = document.getElementById('sealOverlay');
const sealBig     = document.getElementById('sealBig');
const sealClose   = document.getElementById('sealClose');

function openSeal(){
  // Borrow the masthead's data URI rather than embedding the image twice.
  if(!sealBig.getAttribute('src')) sealBig.src = sealImg.src;
  sealOverlay.classList.add('show');
  sealClose.focus();
}
function closeSeal(){ sealOverlay.classList.remove('show'); }

sealImg.addEventListener('click', openSeal);
sealImg.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSeal(); }
});
// Anywhere on the overlay — backdrop, ×, or the seal itself.
sealOverlay.addEventListener('click', closeSeal);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && sealOverlay.classList.contains('show')) closeSeal();
});

/* ---------- mini player ----------
   One <audio> element, reused. State is explicit rather than inferred from the
   element, because a 'pause' event fires for both pausing and stopping and the
   two have to leave different buttons on screen. */
const player   = document.getElementById('player');
const btnPlay  = document.getElementById('btnPlay');
const btnPause = document.getElementById('btnPause');
const btnStop  = document.getElementById('btnStop');
const notes    = document.getElementById('notes');
const seek     = document.getElementById('seek');
const pcur     = document.getElementById('pcur');
const pdur     = document.getElementById('pdur');
const pmsg     = document.getElementById('pmsg');

let audio = null;          // the one <audio> element, reused
let audioSrc = null;       // what that element currently holds
let trackSrc = null;       // what the aarti on screen offers, if anything
let playerState = 'idle';  // idle | buffering | playing | paused
let scrubbing = false;     // true between grabbing the handle and letting go

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function paintSeek(pos, dur){
  pcur.textContent = fmtTime(pos);
  const pct = dur > 0 ? (pos / dur) * 100 : 0;
  seek.style.setProperty('--p', pct.toFixed(2) + '%');
}

function showTime(){
  if(!audio || !audio.duration || isNaN(audio.duration)) return;
  // While the handle is held, the drag owns the readout — otherwise each
  // timeupdate would yank the thumb back to the playhead mid-gesture.
  if(scrubbing) return;
  seek.value = audio.currentTime;
  paintSeek(audio.currentTime, audio.duration);
}

function onMetadata(){
  if(!audio || !audio.duration || isNaN(audio.duration)) return;
  seek.max = audio.duration;
  seek.disabled = false;
  pdur.textContent = fmtTime(audio.duration);
  showTime();
}

// idle | buffering | playing | paused
function setPlayerState(state){
  playerState = state;
  btnPlay.hidden  = (state === 'playing');
  btnPause.hidden = (state !== 'playing');
  btnStop.hidden  = (state === 'idle');
  notes.hidden    = (state !== 'playing');
  btnPlay.disabled = (state === 'buffering');
  btnPlay.classList.toggle('loading', state === 'buffering');
  btnPlay.setAttribute('aria-label', state === 'paused' ? 'पुढे चालू करा' : 'आरती ऐका');
}

function showError(){
  setPlayerState('idle');
  pmsg.textContent = 'ही आरती ऐकता आली नाही';
  pmsg.hidden = false;
}

// Built as soon as a page with a recording renders, with preload='metadata':
// the seek bar is meaningless without a duration, and asking for the header
// costs a few KB against the megabytes a full preload would pull down.
function ensureAudio(src){
  if(audio && audioSrc === src) return audio;
  if(audio) audio.pause();
  audio = new Audio();
  audio.preload = 'metadata';
  audio.src = src;
  audioSrc = src;
  seek.disabled = true;
  seek.max = 0;
  seek.value = 0;
  pdur.textContent = '0:00';
  paintSeek(0, 0);
  // 'waiting' and 'playing' are the browser telling us about the buffer, so the
  // spinner reflects the real network state rather than a guessed delay.
  audio.addEventListener('waiting',       () => setPlayerState('buffering'));
  audio.addEventListener('playing',       () => setPlayerState('playing'));
  audio.addEventListener('ended',         stopAudio);
  audio.addEventListener('timeupdate',    showTime);
  audio.addEventListener('loadedmetadata', onMetadata);
  audio.addEventListener('durationchange', onMetadata);
  audio.addEventListener('error', showError);
  return audio;
}

/* Dragging previews; releasing commits. Seeking on every input event would fire
   a range request per pixel of travel across a file served over the network. */
seek.addEventListener('input', () => {
  if(!audio) return;
  scrubbing = true;
  paintSeek(+seek.value, audio.duration || 0);
});
seek.addEventListener('change', () => {
  if(!audio) return;
  audio.currentTime = +seek.value;
  scrubbing = false;
  paintSeek(+seek.value, audio.duration || 0);
});

function playAudio(){
  if(!trackSrc) return;
  pmsg.hidden = true;
  const a = ensureAudio(trackSrc);
  setPlayerState('buffering');
  a.play().then(() => setPlayerState('playing')).catch(showError);
}

function pauseAudio(){
  if(audio) audio.pause();
  setPlayerState('paused');
  showTime();
}

function stopAudio(){
  scrubbing = false;
  if(audio){ audio.pause(); audio.currentTime = 0; }
  setPlayerState('idle');
  seek.value = 0;
  paintSeek(0, (audio && audio.duration) || 0);
}

btnPlay.addEventListener('click', playAudio);
btnPause.addEventListener('click', pauseAudio);
btnStop.addEventListener('click', stopAudio);

/* Which aartis have a recording is discovered at load rather than written into
   the array above: the server lists aartisangrah/audio/, and a file whose name
   starts with the aarti's number becomes that page's track. Dropping
   07-vitthal.mp3 into the folder is the whole of adding audio to aarti 7.
   If the fetch fails the reader simply has no players — never a broken one. */
fetch('/aartisangrah/audio/manifest.json')
  .then(r => (r.ok ? r.json() : {}))
  .then(map => {
    let currentGained = false;
    for (const key of Object.keys(map)) {
      const i = parseInt(key, 10) - 1;
      if (i < 0 || i >= aartis.length) continue;   // a stray number names no aarti
      aartis[i].audio = map[key];
      if (i === current) currentGained = true;
    }
    if (currentGained) renderPage(current, null);  // the open page just grew a player
  })
  .catch(() => { /* no manifest, no players */ });

/* init */
renderPage(0, null);
</script>
