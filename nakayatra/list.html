<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Naka Family Yatra – Final List</title>
<meta property="og:title" content="Naka Family Yatra – Final List (Feb 2027)">
<meta property="og:description" content="Please check your name, Aadhaar, age, mobile number and gothram — correct it if anything is wrong.">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EE; --card:#FFFFFF; --ink:#2B2118; --muted:#7A6A5A; --line:#EADFCF;
    --brand:#B4471E; --brand-dark:#8A3416; --brand-soft:#FBE7DA;
    --yes:#1E7A4C; --yes-soft:#E1F3E8; --no:#B42318; --no-soft:#FDE6E3;
    --pend:#8A6D1E; --pend-soft:#FBF1D6; --wa:#1FA855;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
  header.hero{background:linear-gradient(135deg,var(--brand) 0%,#D9762B 100%);color:#fff;border-radius:18px;padding:22px 20px 20px;position:relative;overflow:hidden}
  header.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
  .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;font-weight:600}
  .hero h1{margin:4px 0 2px;font-size:26px;line-height:1.15;font-weight:700}
  .hero p{margin:0;opacity:.92}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .greet{font-size:15px;color:var(--muted);margin:0}
  .name{font-size:24px;font-weight:700;margin:0 0 10px}
  .q{font-size:18px;font-weight:600;margin:0 0 14px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font:inherit;font-size:19px;font-weight:700;cursor:pointer;transition:all .15s;color:var(--ink)}
  .choice small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
  .choice.yes:hover,.choice.yes.on{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
  .choice.no:hover,.choice.no.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
  .choice:disabled{cursor:not-allowed;opacity:.6}
  .choice.on{opacity:1!important}
  .note{font-size:14px;color:var(--muted);margin:12px 0 0}
  .banner{border-radius:12px;padding:10px 14px;font-weight:600;margin-top:16px;font-size:15px}
  .banner.frozen{background:#EEF2F7;color:#344054;border:1px solid #D0D5DD}
  .banner.ok{background:var(--yes-soft);color:var(--yes)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{border-radius:12px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:26px;line-height:1.1}
  .stat span{font-size:13px;font-weight:600}
  .s-yes{background:var(--yes-soft);color:var(--yes)} .s-no{background:var(--no-soft);color:var(--no)}
  .s-pend{background:var(--pend-soft);color:var(--pend)} .s-tot{background:var(--brand-soft);color:var(--brand-dark)}
  .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--line)}
  .bar i{display:block;height:100%}
  h2{font-size:18px;margin:0 0 12px}
  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
  .list li:first-child{border-top:0}
  .sr{width:26px;color:var(--muted);font-size:14px;text-align:right;flex:none}
  .who{flex:1;min-width:0}
  .who .n{font-weight:600}
  .who .t{font-size:12.5px;color:var(--muted)}
  .me-row{background:var(--brand-soft);border-radius:10px;padding-left:8px!important;padding-right:8px!important}
  .pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;flex:none}
  .p-yes{background:var(--yes-soft);color:var(--yes)} .p-no{background:var(--no-soft);color:var(--no)} .p-pend{background:var(--pend-soft);color:var(--pend)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn-wa{background:var(--wa);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-lg{padding:12px 16px;font-size:16px}
  .btn-freeze{background:#344054;color:#fff}
  .btn-open{background:var(--brand);color:#fff}
  .acts{display:flex;gap:6px;flex:none}
  .row-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .err{background:var(--no-soft);color:var(--no);border-radius:12px;padding:14px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .demo{background:#FFF8D6;border:1px dashed #D9B84A;color:#6B5310;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero h1{font-size:22px}
    .admin li{flex-wrap:wrap}
    .admin .acts{width:100%;padding-left:36px}
    .admin .acts .btn{flex:1}
  }
  input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:160px;resize:vertical}
  label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
  .msg{font-size:14px;margin-top:8px;min-height:1em} .msg.error{color:var(--no)} .msg.ok{color:var(--yes)}
  .btn-x{background:#fff;border:1px solid var(--line);color:var(--no)}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
  .search{margin-top:16px}
  .member{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#fff}
  .member.open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .m-top{display:flex;align-items:flex-start;gap:10px}
  .m-sr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .m-name{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.25;padding-top:2px}
  .m-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0 38px;font-size:15px}
  .m-grid dt{color:var(--muted)} .m-grid dd{margin:0;font-weight:600;word-break:break-word}
  .m-grid dd.missing{color:var(--no);font-weight:600}
  .flag{display:inline-flex;align-items:center;gap:4px;margin:10px 0 0 38px;font-size:12.5px;font-weight:700;color:#8A6D1E;background:var(--pend-soft);border-radius:999px;padding:3px 10px}
  .m-acts{margin:12px 0 0 38px}
  form.edit{margin:12px 0 0 38px}
  form.edit .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
  form.edit .row2{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  form.edit .row2 .btn{flex:1}
  .legend{font-size:14px;color:var(--muted);margin:8px 0 0}
  @media (max-width:420px){ .m-grid,.flag,.m-acts,form.edit{margin-left:0} }
  .sched{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:16px;margin-top:16px;border:1px solid var(--line);background:#0E2A5C}
  .kv{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:0}
  .kv .k{width:110px;flex:none;color:var(--muted);font-size:14px}
  .kv .v{flex:1;min-width:0;font-weight:700;word-break:break-word}
  .cp{flex:none;width:34px;height:34px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand-dark);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
  .cp svg{width:16px;height:16px}
  .cp.done{background:var(--yes-soft);color:var(--yes);border-color:var(--yes)}
  .m-grid{grid-template-columns:auto 1fr auto;align-items:center}
  .m-grid dd.c{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="eyebrow">🙏 February 2027</div><h1>Naka Family Yatra</h1><p>Final list of members joining</p></header>
  <img class="sched" src="/nakayatra/schedule.jpg" width="960" height="640" alt="Yatra schedule: depart Kalyan Wed 10 Feb 2027, reach Tirupati Thu 11 Feb, Tirumala darshan Fri 12 Feb, leave Tirupati Sat 13 Feb, reach home Sun 14 Feb">
  <div id="app"><div class="loading">Loading…</div></div>
  <footer>Naka Family · Please check only your own details. This page is for our group only — don't forward it.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var code = (location.pathname.split('/')[3] || '').trim();
  var app = document.getElementById('app');
  var state = null, openId = null, q = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2500); }
  function when(s) { if (!s) return ''; var d = new Date(s.replace(' ', 'T') + '+05:30'); return isNaN(d) ? s : d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function api(path, opts) {
    opts = opts || {};
    return fetch('/api/nakayatra/list/' + encodeURIComponent(code) + (path || ''), {
      method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
  }
  // Copy buttons: every value can be tapped and pasted into the TTD booking form.
  var CP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  function cpBtn(v, label) { return '<button type="button" class="cp" data-copy="' + esc(v) + '" aria-label="Copy ' + esc(label) + '">' + CP + '</button>'; }
  function mob10(s) { var d = String(s || '').replace(/\D/g, ''); return d.length > 10 ? d.slice(-10) : d; }
  function legacyCopy(v) { var a = document.createElement('textarea'); a.value = v; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }
  function copyText(v, b) {
    var done = function () { toast('Copied: ' + (v.length > 30 ? v.slice(0, 30) + '…' : v)); b.innerHTML = TICK; b.classList.add('done'); setTimeout(function () { b.innerHTML = CP; b.classList.remove('done'); }, 1400); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done, function () { legacyCopy(v); done(); });
    else { legacyCopy(v); done(); }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-copy]');
    if (b) copyText(b.getAttribute('data-copy'), b);
  });
  function bookingHtml(bk) {
    if (!bk) return '';
    return '<section class="card"><h2>Common booking details</h2>' + [['Darshan date', bk.darshanDate], ['State', bk.state], ['City', bk.city], ['Pincode', bk.pincode]].map(function (r) {
      return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1]) + '</span>' + cpBtn(r[1], r[0]) + '</div>';
    }).join('') + '</section>';
  }
  function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

  function memberHtml(m) {
    var open = openId === m.id;
    var h = '<div class="member' + (open ? ' open' : '') + '" id="m' + m.id + '"><div class="m-top"><span class="m-sr">' + m.sr + '</span><div class="m-name">' + esc(m.name) + '</div>' + (open ? '' : cpBtn(m.name, 'name')) + '</div>';
    if (!open) {
      // The group link gets a masked Aadhaar (no copy button); the booking link gets the
      // full 12 digits as aadhaarFull, shown spaced and copied as plain digits.
      var fullA = m.aadhaarFull || '';
      h += '<dl class="m-grid"><dt>Aadhaar</dt><dd' + (m.hasAadhaar ? '>' + esc(fullA ? fullA.replace(/(\d{4})(?=\d)/g, '$1 ') : m.aadhaar) : ' class="missing">Not given — please add') + '</dd><dd class="c">' + (fullA ? cpBtn(fullA, 'Aadhaar') : '') + '</dd>' +
        '<dt>Age</dt><dd' + (m.age ? '>' + m.age + ' yrs' : ' class="missing">Not given') + '</dd><dd class="c">' + (m.age ? cpBtn(String(m.age), 'age') : '') + '</dd>' +
        '<dt>Mobile</dt><dd' + (m.mobile ? '>' + esc(m.mobile) : ' class="missing">Not given') + '</dd><dd class="c">' + (m.mobile ? cpBtn(mob10(m.mobile), 'mobile') : '') + '</dd>' +
        '<dt>Gothram</dt><dd>' + esc(m.gothram) + '</dd><dd class="c">' + (m.gothram ? cpBtn(m.gothram, 'gothram') : '') + '</dd></dl>';
      if (m.corrected) h += '<div class="flag">✎ Corrected · ' + esc(when(m.correctedAt)) + ' · ' + esc(m.correctedFields.join(', ')) + '</div>';
      if (!state.locked) h += '<div class="m-acts"><button class="btn btn-ghost" data-edit="' + m.id + '">✎ Correct my details</button></div>';
    } else {
      h += '<form class="edit" data-id="' + m.id + '">' +
        '<label>Full name (as on Aadhaar)</label><input type="text" name="name" value="' + esc(m.name) + '" maxlength="80" autocomplete="off">' +
        '<label>Aadhaar number</label><input type="text" name="aadhaar" inputmode="numeric" placeholder="' + (m.hasAadhaar ? 'Only if wrong — type all 12 digits' : '12-digit Aadhaar number') + '" maxlength="14" autocomplete="off">' +
        (m.hasAadhaar ? '<p class="hint">Saved number ends with <b>' + esc(m.aadhaar.slice(-4)) + '</b>. Leave blank if that is correct.</p>' : '') +
        '<label>Age (in Feb 2027)</label><input type="text" name="age" inputmode="numeric" value="' + (m.age || '') + '" maxlength="3" autocomplete="off">' +
        '<label>Mobile number</label><input type="text" name="mobile" inputmode="tel" value="' + esc(m.mobile) + '" maxlength="20" autocomplete="off">' +
        '<label>Gothram</label><input type="text" name="gothram" value="' + esc(m.gothram) + '" maxlength="40" autocomplete="off">' +
        '<p class="hint">Kashyap is filled in for everyone. Change it only if yours is different.</p>' +
        '<div class="msg error"></div>' +
        '<div class="row2"><button class="btn btn-lg btn-open" type="submit">Save correction</button><button class="btn btn-lg btn-ghost" type="button" data-cancel>Cancel</button></div></form>';
    }
    return h + '</div>';
  }

  function render() {
    var rows = state.rows.filter(function (m) { return !q || norm(m.name).indexOf(norm(q)) !== -1; });
    var nCorr = state.rows.filter(function (m) { return m.corrected; }).length;
    var h = bookingHtml(state.booking) + '<section class="card"><h2 style="margin:0">' + state.rows.length + ' members joining</h2>' +
      '<p class="legend">Find your name and check your Aadhaar, age, mobile number and gothram. If anything is wrong, tap <b>Correct my details</b>. Changed rows are marked <b>✎ Corrected</b>.' +
      (nCorr ? ' (' + nCorr + ' corrected so far)' : '') + '</p>' +
      (state.booker ? '<div class="banner frozen">🔑 Booking link — full Aadhaar numbers are shown for the TTD booking. Please don\'t forward this link.</div>' : '') +
      (state.locked ? '<div class="banner frozen">🔒 The list is final and locked. Contact the admin for any change.</div>' : '') +
      '<div class="search"><input type="text" id="q" placeholder="Search your name…" value="' + esc(q) + '" autocomplete="off"></div></section>';
    h += '<section class="card" style="padding-top:8px">' + (rows.length ? rows.map(memberHtml).join('') : '<p class="note">No name matches “' + esc(q) + '”.</p>') + '</section>';
    app.innerHTML = h;

    var qi = document.getElementById('q');
    qi.oninput = function () { q = qi.value; var pos = qi.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    app.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openId = Number(b.getAttribute('data-edit')); render(); var el = document.getElementById('m' + openId); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }; });
    app.querySelectorAll('[data-cancel]').forEach(function (b) { b.onclick = function () { openId = null; render(); }; });
    app.querySelectorAll('form.edit').forEach(function (f) {
      f.onsubmit = function (e) {
        e.preventDefault();
        var id = Number(f.getAttribute('data-id')), msg = f.querySelector('.msg');
        var body = { name: f.name.value, aadhaar: f.aadhaar.value, age: f.age.value, mobile: f.mobile.value, gothram: f.gothram.value };
        var btn = f.querySelector('[type=submit]'); btn.disabled = true; msg.textContent = '';
        api('/' + id, { method: 'PATCH', body: body }).then(function (res) {
          state.rows = state.rows.map(function (m) { return m.id === id ? res.row : m; });
          openId = null; render();
          toast(res.changed.length ? '✓ Saved: ' + res.changed.join(', ') : 'Nothing changed');
        }).catch(function (err) { btn.disabled = false; msg.textContent = err.message; });
      };
    });
  }

  function load() {
    api().then(function (s) { state = s; render(); })
      .catch(function (e) { app.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
  }
  if (!code) app.innerHTML = '<div class="card err">Please open the link shared in the WhatsApp group.</div>';
  else load();
})();
</script>
</body>
</html>
