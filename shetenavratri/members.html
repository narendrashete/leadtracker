<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>सभासद यादी — शेटे परिवार नवरात्री</title>
<link rel="stylesheet" href="/shetenavratri/assets/css/style.css">
</head>
<body>

<header class="topbar">
  <a href="/shetenavratri/" class="back-link">←</a>
  <div>
    <h1>सभासद यादी</h1>
    <div class="sub">Members List</div>
  </div>
</header>

<div class="page">
  <div class="search-wrap">
    <div class="search-box">
      <span class="sicon">🔍</span>
      <input type="text" id="searchInput" placeholder="नाव / गाव शोधा... (search name or village)">
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div class="loading-note" id="loadingNote">सभासद यादी लोड होत आहे...</div>
  <div class="member-list" id="memberList"></div>
  <div class="no-results" id="noResults" style="display:none;">🔍 कोणताही सभासद सापडला नाही<br><span style="font-size:12px;">No member found</span></div>
</div>

<button class="fab" id="addMemberFab" aria-label="सभासद जोडा">➕</button>

<div class="modal-overlay form-overlay" id="addMemberOverlay">
  <div class="form-sheet">
    <button class="modal-close" id="addMemberClose">✕</button>
    <h2>नवीन सभासद नोंदणी</h2>
    <p class="form-hint">विनंती Admin कडून मंजूर झाल्यावर सभासद यादीत दिसेल.</p>
    <form id="addMemberForm">
      <label>नाव (Name) *<input type="text" id="mName" required maxlength="80"></label>
      <label>गावाचे नाव (Village) *<input type="text" id="mVillage" required maxlength="60"></label>
      <label>संपर्क क्रमांक (Mobile) *<input type="tel" id="mMobile" required pattern="[0-9]{10}" maxlength="10" placeholder="10 अंकी मोबाईल क्रमांक"></label>
      <div class="form-msg" id="addMemberMsg"></div>
      <button type="submit" class="form-submit">विनंती पाठवा</button>
    </form>
  </div>
</div>

<div class="footer-credit">
  <span class="credit-label">Developed by</span>
  <a class="credit" href="https://www.primecomputers.co.in" target="_blank" rel="noopener noreferrer">
    <img class="credit-logo" src="/shetenavratri/assets/img/prime-computers-logo.png" alt="Prime Computers" width="200" height="70">
  </a>
</div>

<script src="/shetenavratri/assets/js/protect.js"></script>
<script src="/shetenavratri/assets/js/members.js"></script>
</body>
</html>
